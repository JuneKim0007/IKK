    <line x1="154" y1="59" x2="154" y2="619" stroke="#343A35"/>
    <text x="14" y="84" fill="#7F8880" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing="1.4">LAYERS</text>
    <text x="137" y="84" text-anchor="end" fill="#7F8880" font-family="monospace" font-size="8">06</text>
    <line x1="0" y1="96" x2="154" y2="96" stroke="#343A35"/>
    <g font-family="Arial" font-size="10" fill="#D9DDD7">
