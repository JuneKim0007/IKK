    <text x="14" y="639" fill="#7F8880" font-family="IBM Plex Mono,monospace" font-size="8">HOME · 375 × 667 DP · 6 NODES</text>
    <text x="800" y="639" text-anchor="end" fill="#B7E36D" font-family="IBM Plex Mono,monospace" font-size="8">0 VIOLATIONS</text>
