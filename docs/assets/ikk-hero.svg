<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">IKK Contract Studio</title>
  <desc id="desc">A dark interface editor showing one minimal design contract generating Web and Android code.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#303630"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#0F1210"/>
  <rect width="1440" height="760" rx="28" fill="url(#dots)" opacity=".55"/>

  <g font-family="Manrope,Arial,sans-serif">
    <rect x="64" y="62" width="52" height="44" rx="10" fill="#B7E36D"/>
    <text x="90" y="90" text-anchor="middle" fill="#151816" font-size="15" font-weight="800" letter-spacing="-1">IKK</text>
    <text x="130" y="78" fill="#F4F0E8" font-size="12" font-weight="700" letter-spacing="2">CONTRACT STUDIO</text>
    <text x="130" y="98" fill="#7F8880" font-size="11" letter-spacing="1.2">HACKATHON BUILD / 2026</text>

    <text x="64" y="198" fill="#F4F0E8" font-size="62" font-weight="700" letter-spacing="-3.6">One source.</text>
    <text x="64" y="264" fill="#F4F0E8" font-size="62" font-weight="700" letter-spacing="-3.6">Every surface.</text>
    <text x="66" y="316" fill="#9AA19B" font-size="16">Design once. Generate deterministic CSS,</text>
    <text x="66" y="342" fill="#9AA19B" font-size="16">HTML, and Jetpack Compose from the same JSON.</text>

    <g transform="translate(64 410)">
      <rect width="132" height="38" rx="8" fill="#B7E36D"/>
      <text x="66" y="24" text-anchor="middle" fill="#151816" font-size="12" font-weight="700">JSON CONTRACT</text>
      <text x="151" y="24" fill="#687069" font-size="18">→</text>
      <rect x="180" width="76" height="38" rx="8" fill="#1B201C" stroke="#343A35"/>
      <text x="218" y="24" text-anchor="middle" fill="#F4F0E8" font-size="11" font-weight="700">CSS</text>
      <rect x="264" width="76" height="38" rx="8" fill="#1B201C" stroke="#343A35"/>
      <text x="302" y="24" text-anchor="middle" fill="#F4F0E8" font-size="11" font-weight="700">HTML</text>
      <rect x="348" width="92" height="38" rx="8" fill="#1B201C" stroke="#343A35"/>
      <text x="394" y="24" text-anchor="middle" fill="#F4F0E8" font-size="11" font-weight="700">KOTLIN</text>
    </g>

