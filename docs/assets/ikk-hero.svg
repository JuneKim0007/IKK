      <rect x="105" y="42" width="95" height="28" rx="5" fill="#111412" stroke="#343A35"/><text x="117" y="60" fill="#7F8880" font-size="8">Y</text><text x="186" y="60" text-anchor="end" fill="#D8DCD6" font-size="9">87</text>
      <text y="98" fill="#ECEDE8" font-size="10" font-weight="600">Text</text>
