      <circle cx="5" cy="-4" r="5" fill="#B7E36D"/>
      <text x="19" y="0" fill="#A0A8A1" font-size="11" letter-spacing=".8">CONTRACT CLEAN</text>
      <text x="190" y="0" fill="#5E665F" font-size="11">•</text>
      <text x="211" y="0" fill="#A0A8A1" font-size="11" letter-spacing=".8">3 TARGETS</text>
      <text x="323" y="0" fill="#5E665F" font-size="11">•</text>
      <text x="344" y="0" fill="#A0A8A1" font-size="11" letter-spacing=".8">0 AI GUESSES</text>
    </g>
