      <circle cx="16" cy="150" r="3" fill="#8C948D"/><text x="29" y="154">Cursor</text><text x="137" y="154" text-anchor="end" fill="#687069" font-family="monospace" font-size="7">triangle</text>
      <circle cx="16" cy="182" r="3" fill="#8C948D"/><text x="29" y="186">Signal</text><text x="137" y="186" text-anchor="end" fill="#687069" font-family="monospace" font-size="7">ellipse</text>
      <circle cx="16" cy="214" r="3" fill="#8C948D"/><text x="29" y="218">Divider</text><text x="137" y="218" text-anchor="end" fill="#687069" font-family="monospace" font-size="7">line</text>
      <rect x="7" y="229" width="140" height="31" rx="6" fill="#29341F" stroke="#52653B"/>
      <circle cx="16" cy="245" r="3" fill="#B7E36D"/><text x="29" y="249">Statement</text><text x="137" y="249" text-anchor="end" fill="#8FA273" font-family="monospace" font-size="7">text</text>
      <circle cx="16" cy="278" r="3" fill="#8C948D"/><text x="29" y="282">Background</text><text x="137" y="282" text-anchor="end" fill="#687069" font-family="monospace" font-size="7">rect</text>
    </g>

