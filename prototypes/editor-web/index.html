<title>Canvas Contract Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --chrome: #F2F3F1; --chrome-2: #E7E9E6; --workspace: #9DA2A0;
    --panel: #FFFFFF; --ink: #1B1D1C; --muted: #616764; --line: #CFD2CE;
    --sel: #2F5D8C; --sel-soft: #DDE8F3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chrome: #1A1C1B; --chrome-2: #232625; --workspace: #2B2F2D;
      --panel: #202322; --ink: #E5E8E6; --muted: #949B98; --line: #343836;
      --sel: #8FB5DC; --sel-soft: #1A2A39;
    }
  }
  :root[data-theme="dark"] {
    --chrome: #1A1C1B; --chrome-2: #232625; --workspace: #2B2F2D;
    --panel: #202322; --ink: #E5E8E6; --muted: #949B98; --line: #343836;
    --sel: #8FB5DC; --sel-soft: #1A2A39;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--chrome); color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px; line-height: 1.4; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

  .app { display: grid; grid-template-rows: auto minmax(0,1fr) auto; height: 100%; }

  /* toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: -0.01em; }
  .tag {
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
    letter-spacing: .09em; text-transform: uppercase;
    color: var(--sel); background: var(--sel-soft);
    padding: 2px 6px; border-radius: 3px;
  }
  .tools { display: flex; gap: 3px; margin-left: 14px; }
  .tool {
    width: 34px; height: 30px; border-radius: 6px;
    border: 1px solid transparent; background: none;
    display: grid; place-items: center;
  }
  .tool:hover { background: var(--chrome-2); border-color: var(--line); }
  .tool[aria-pressed="true"] { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); }
  .tool svg { width: 17px; height: 17px; }

  .toolgroup { position: relative; }
  .tool-shape { width: 44px; gap: 2px; grid-auto-flow: column; }
  .caret {
    width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
    border-top: 4px solid currentColor; opacity: .7; display: block;
  }
  .flyout {
    position: absolute; top: calc(100% + 5px); left: 0; z-index: 30; min-width: 178px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,.18); padding: 4px; display: grid; gap: 2px;
  }
  .flyout button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 1px solid transparent; background: none; border-radius: 5px;
    padding: 7px 8px; font-size: 12.5px; text-align: left; color: inherit;
  }
  .flyout button:hover { background: var(--chrome-2); }
  .flyout button[aria-checked="true"] { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); font-weight: 600; }
  .flyout svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .flyout kbd {
    margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 10px;
    color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px;
  }
  .grow { margin-left: auto; }
  .btn {
    border: 1px solid var(--line); background: var(--panel);
    padding: 6px 11px; border-radius: 5px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--chrome-2); }
  .btn-primary { background: var(--sel); border-color: var(--sel); color: #fff; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.1); }

  /* columns */
  .cols { display: grid; grid-template-columns: 200px minmax(0,1fr) 232px; min-height: 0; }
  .side { background: var(--panel); min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); overflow: hidden; }
  .side.l { border-right: 1px solid var(--line); }
  .side.r { border-left: 1px solid var(--line); }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 11px; background: var(--chrome-2); border-bottom: 1px solid var(--line);
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  .scroll { overflow-y: auto; min-height: 0; }

  /* layers */
  .layers { padding: 4px; }
  .layer {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 5px 6px; border-radius: 4px;
    border: 1px solid transparent; background: none; text-align: left; font-size: 12px;
  }
  .layer[aria-current="true"] { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); font-weight: 600; }
  .layer:hover { background: var(--chrome-2); }
  .layer .eye { border: none; background: none; padding: 0; width: 18px; font-size: 11px; opacity: .85; }
  .layer .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               border: none; background: none; text-align: left; padding: 0; font: inherit; color: inherit; }
  .layer .ty { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; color: var(--muted); }

  /* canvas */
  .stage { background: var(--workspace); overflow: auto; min-height: 0; display: grid; place-items: center; padding: 26px; }
  .frame {
    background: #FFFFFF; position: relative; flex: 0 0 auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.26);
  }
  .frame.draw { cursor: crosshair; }

  .n { position: absolute; display: flex; overflow: hidden; }
  .n.hid { display: none; }
  .n .tx {
    width: 100%; padding: 4px 6px; outline: none;
    white-space: pre-wrap; word-break: break-word;
  }
  .n.selected { outline: 1.5px solid var(--sel); outline-offset: 0; }
  .n:hover:not(.selected) { outline: 1px dashed var(--sel); }
  .n.editing { outline: 1.5px solid var(--sel); cursor: text; }
  .n.editing .tx { cursor: text; }

  .hd { position: absolute; width: 8px; height: 8px; background: #fff; border: 1px solid var(--sel); border-radius: 1px; z-index: 6; }
  .hd-nw{left:-4px;top:-4px;cursor:nwse-resize}.hd-n{left:calc(50% - 4px);top:-4px;cursor:ns-resize}
  .hd-ne{right:-4px;top:-4px;cursor:nesw-resize}.hd-e{right:-4px;top:calc(50% - 4px);cursor:ew-resize}
  .hd-se{right:-4px;bottom:-4px;cursor:nwse-resize}.hd-s{left:calc(50% - 4px);bottom:-4px;cursor:ns-resize}
  .hd-sw{left:-4px;bottom:-4px;cursor:nesw-resize}.hd-w{left:-4px;top:calc(50% - 4px);cursor:ew-resize}

  /* properties */
  .grp { border-bottom: 1px solid var(--line); padding: 10px 11px; }
  .grp-t { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .xy { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
  .num { display: flex; align-items: center; gap: 4px; }
  .num label { font-size: 10.5px; color: var(--muted); width: 10px; flex: 0 0 auto; }
  .num input {
    width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--chrome-2);
    border-radius: 4px; padding: 3px 5px;
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .num input:focus { outline: none; border-color: var(--sel); }

  .row { display: grid; gap: 4px; margin-bottom: 8px; }
  .row label { font-size: 10.5px; color: var(--muted); }
  .row.inline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row input[type=text], .row select {
    width: 100%; border: 1px solid var(--line); background: var(--chrome-2);
    border-radius: 4px; padding: 4px 6px; font-size: 12px;
  }
  .row input[type=color] { width: 42px; height: 26px; padding: 1px 2px; border: 1px solid var(--line); border-radius: 4px; background: var(--chrome-2); }
  .row input:focus, .row select:focus { outline: none; border-color: var(--sel); }

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); padding: 0; }
  .sw:hover { transform: scale(1.12); }

  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 22px; height: 22px; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 4px; padding: 0; line-height: 1; }
  .stepper input { width: 46px; text-align: center; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 4px; padding: 3px 2px;
                   font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
  .seg { display: flex; gap: 3px; }
  .seg button { flex: 1 1 0; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 4px; padding: 4px 0; font-size: 12px; }
  .seg button[aria-pressed="true"] { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); }

  /* status */
  .status {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line);
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted);
  }
  .status select { border: 1px solid var(--line); background: var(--chrome-2); border-radius: 4px; padding: 2px 5px; font-size: 11px; }

  /* drawer */
  .drawer { position: fixed; inset: 0; background: rgba(8,11,12,.55); display: grid; place-items: end center; z-index: 40; }
  .sheet {
    background: var(--panel); border-radius: 11px 11px 0 0; width: min(1040px,100%); height: min(86%,100%);
    display: grid; grid-template-rows: auto auto minmax(0,1fr); box-shadow: 0 -8px 40px rgba(0,0,0,.32);
  }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px 10px; }
  .sheet-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .tabs { display: flex; gap: 3px; padding: 0 15px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 7px 10px; font-size: 12px; font-weight: 500; color: var(--muted);
    font-family: "IBM Plex Mono", monospace; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--sel); border-bottom-color: var(--sel); }
  .code { margin: 0; padding: 13px 15px 20px; overflow: auto; min-height: 0;
          font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.6; white-space: pre; }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .cols { grid-template-columns: minmax(0,1fr); }
    .side { overflow: visible; grid-template-rows: auto auto; }
    .side.l, .side.r { border: none; border-bottom: 1px solid var(--line); }
    .scroll { overflow: visible; }
    .stage { padding: 18px 12px; }
  }
</style>

<div class="app">
  <header class="toolbar">
    <span class="logo">Canvas Editor</span>
    <span class="tag">Web</span>
    <div class="tools" id="tools" role="toolbar" aria-label="Tools">
      <button class="tool" data-t="move" aria-pressed="true" title="Move (V)" aria-label="Move">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2l12 7-5 1.6L8.6 16z"/></svg></button>
      <div class="toolgroup">
        <button class="tool tool-shape" id="shapeBtn" aria-pressed="false" aria-haspopup="menu"
                aria-expanded="false" title="Shape (S)" aria-label="Shape">
          <span id="shapeIcon"></span><i class="caret"></i>
        </button>
        <div class="flyout" id="shapeFly" role="menu" aria-label="Shape" hidden></div>
      </div>
      <button class="tool" data-t="text" aria-pressed="false" title="Text (T)" aria-label="Text">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h12M10 5v11M7.5 16h5"/></svg></button>
      <button class="tool" data-t="image" aria-pressed="false" title="Image (I)" aria-label="Image">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8" r="1.2"/><path d="M4 14l4-4 3 2.5 2.5-2L16 13"/></svg></button>
    </div>
    <span class="grow"></span>
    <button class="btn" id="undoBtn" title="Undo">&#8634;</button>
    <button class="btn" id="delBtn">Delete</button>
    <button class="btn" id="themeBtn">Theme</button>
    <button class="btn btn-primary" id="genBtn">Generate</button>
  </header>

  <div class="cols">
    <nav class="side l" aria-label="Layers">
      <div class="head"><span>Layers</span><span id="lcount">0</span></div>
      <div class="layers scroll" id="layers"></div>
    </nav>

    <main class="stage" id="stage">
      <div class="frame" id="frame"></div>
    </main>

    <aside class="side r" aria-label="Properties">
      <div class="head"><span>Properties</span><span id="ptype">—</span></div>
      <div class="scroll" id="props"></div>
    </aside>
  </div>

  <footer class="status">
    <span>Home</span><span id="sframe">375 &times; 667</span>
    <span class="grow"></span>
    <label for="zoom">Zoom</label>
    <select id="zoom">
      <option value="0.7">70%</option><option value="0.85">85%</option>
      <option value="1" selected>100%</option><option value="1.25">125%</option>
    </select>
    <span id="ssel">no selection</span>
  </footer>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="sheet-head">
      <h2 id="st">Generate</h2><span class="grow"></span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)" id="cpLabel">cp_001</span>
      <button class="btn" id="closeBtn">Close</button>
    </div>
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" data-p="contract" aria-selected="true">contract.json</button>
      <button role="tab" data-p="kt" aria-selected="false">Home.generated.kt</button>
      <button role="tab" data-p="css" aria-selected="false">home.generated.css</button>
      <button role="tab" data-p="html" aria-selected="false">home.generated.html</button>
    </div>
    <pre class="code" id="out"></pre>
  </div>
</div>

<script src="../shared/editor-core.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var C = window.EditorCore;
  var W = C.W, H = C.H;

  var nodes = C.seed();
  var sel = null, tool = "move", zoom = 1, panel = "contract", cp = 1;
  var hist = [], editing = null;

  function snap() { hist.push(JSON.stringify(nodes)); if (hist.length > 40) hist.shift(); }
  function cur() { return C.byId(nodes, sel); }

  /* ---------- render ---------- */

  function render() {
    var f = $("frame");
    f.style.width = (W * zoom) + "px";
    f.style.height = (H * zoom) + "px";
    f.classList.toggle("draw", tool !== "move");
    f.textContent = "";

    nodes.forEach(function (n) {
      var el = document.createElement("div");
      el.className = "n" + (n.visible ? "" : " hid") + (n.id === sel ? " selected" : "") + (n.id === editing ? " editing" : "");
      el.dataset.id = n.id;
      C.applyBox(el, n, zoom);

      if (n.type === "image") {
        el.style.background = n.fill;
        var lab = document.createElement("span");
        lab.className = "tx";
        lab.style.cssText = "font-size:" + (10 * zoom) + "px;opacity:.6;text-align:center;align-self:center";
        lab.textContent = n.text || "image";
        el.appendChild(lab);
      } else if (n.text !== null && n.text !== undefined) {
        var t = document.createElement("div");
        t.className = "tx";
        C.applyText(t, n, zoom);
        t.textContent = n.text;
        if (n.id === editing) {
          t.contentEditable = "plaintext-only";
          t.addEventListener("input", function () { n.text = t.textContent; renderLayers(); });
          t.addEventListener("blur", function () { editing = null; render(); });
        }
        el.appendChild(t);
      }

      if (n.id === sel && n.id !== editing) {
        ["nw","n","ne","e","se","s","sw","w"].forEach(function (d) {
          var h = document.createElement("span");
          h.className = "hd hd-" + d; h.dataset.dir = d;
          el.appendChild(h);
        });
      }
      f.appendChild(el);
    });

    $("lcount").textContent = String(nodes.length);
    $("sframe").textContent = W + " × " + H;
    var s = cur();
    $("ssel").textContent = s ? (s.name + "  " + Math.round(s.w) + "×" + Math.round(s.h)) : "no selection";
    $("ptype").textContent = s ? s.type : "—";
    renderProps(); renderLayers();
    if (!$("drawer").hidden) paint();
  }

  function renderLayers() {
    var host = $("layers"); host.textContent = "";
    for (var i = nodes.length - 1; i >= 0; i--) {
      (function (n) {
        var row = document.createElement("div");
        row.className = "layer";
        row.setAttribute("aria-current", n.id === sel ? "true" : "false");

        var eye = document.createElement("button");
        eye.type = "button"; eye.className = "eye";
        eye.textContent = n.visible ? "◉" : "○";
        eye.setAttribute("aria-label", (n.visible ? "Hide " : "Show ") + n.name);
        eye.addEventListener("click", function (e) { e.stopPropagation(); n.visible = !n.visible; render(); });

        var nm = document.createElement("button");
        nm.type = "button"; nm.className = "nm"; nm.textContent = n.name;
        nm.addEventListener("click", function () { sel = n.id; editing = null; render(); });

        var ty = document.createElement("span");
        ty.className = "ty"; ty.textContent = n.type;

        row.appendChild(eye); row.appendChild(nm); row.appendChild(ty);
        host.appendChild(row);
      })(nodes[i]);
    }
  }

  /* ---------- properties ---------- */

  function numRow(lbl, val, set) {
    var w = document.createElement("div"); w.className = "num";
    var l = document.createElement("label"); l.textContent = lbl;
    var i = document.createElement("input"); i.type = "number"; i.value = Math.round(val);
    l.htmlFor = i.id = "p_" + lbl;
    i.addEventListener("change", function () { snap(); set(Number(i.value) || 0); render(); });
    w.appendChild(l); w.appendChild(i); return w;
  }

  function renderProps() {
    var host = $("props"); host.textContent = "";
    var n = cur();
    if (!n) {
      var g = document.createElement("div"); g.className = "grp";
      g.innerHTML = '<div class="grp-t">Nothing selected</div>' +
        '<p style="margin:0;font-size:12px;color:var(--muted)">Pick a tool and drag on the canvas, or click a shape.</p>';
      host.appendChild(g); return;
    }

    /* geometry */
    var g1 = document.createElement("div"); g1.className = "grp";
    g1.innerHTML = '<div class="grp-t">Position &amp; size</div>';
    var xy = document.createElement("div"); xy.className = "xy";
    xy.appendChild(numRow("X", n.x, function (v) { n.x = v; }));
    xy.appendChild(numRow("W", n.w, function (v) { n.w = Math.max(4, v); }));
    xy.appendChild(numRow("Y", n.y, function (v) { n.y = v; }));
    xy.appendChild(numRow("H", n.h, function (v) { n.h = Math.max(4, v); }));
    g1.appendChild(xy);
    host.appendChild(g1);

    /* appearance */
    var g2 = document.createElement("div"); g2.className = "grp";
    g2.innerHTML = '<div class="grp-t">Appearance</div>';

    g2.appendChild(colorRow("Fill", n.fill, function (v) { n.fill = v; }));
    var sws = document.createElement("div"); sws.className = "swatches"; sws.style.marginBottom = "9px";
    C.PALETTE.forEach(function (hex) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "sw"; b.style.background = hex;
      b.title = hex; b.setAttribute("aria-label", "Fill " + hex);
      b.addEventListener("click", function () { snap(); n.fill = hex; render(); });
      sws.appendChild(b);
    });
    g2.appendChild(sws);

    g2.appendChild(colorRow("Stroke", n.stroke, function (v) { n.stroke = v; }));
    g2.appendChild(stepRow("Stroke width", n.strokeW, 0, 12, function (v) { n.strokeW = v; }));
    if (n.type !== "ellipse") g2.appendChild(stepRow("Corner radius", n.radius, 0, 60, function (v) { n.radius = v; }));
    g2.appendChild(stepRow("Opacity %", Math.round(n.opacity * 100), 10, 100, function (v) { n.opacity = v / 100; }, 5));
    host.appendChild(g2);

    /* text — only when the node carries text */
    if (n.text !== null && n.text !== undefined && n.type !== "image") {
      var g3 = document.createElement("div"); g3.className = "grp";
      g3.innerHTML = '<div class="grp-t">Text</div>';

      var tr = document.createElement("div"); tr.className = "row";
      var tl = document.createElement("label"); tl.textContent = "content"; tl.htmlFor = "p_text";
      var ti = document.createElement("input"); ti.type = "text"; ti.id = "p_text"; ti.value = n.text;
      ti.addEventListener("input", function () { n.text = ti.value; render(); });
      tr.appendChild(tl); tr.appendChild(ti); g3.appendChild(tr);

      g3.appendChild(stepRow("Font size", n.fontSize, 8, 64, function (v) { n.fontSize = v; }));
      g3.appendChild(colorRow("Text colour", n.textColor, function (v) { n.textColor = v; }));

      var ar = document.createElement("div"); ar.className = "row";
      var al = document.createElement("label"); al.textContent = "align"; ar.appendChild(al);
      var seg = document.createElement("div"); seg.className = "seg";
      [["left","≡"],["center","☰"],["right","≡"]].forEach(function (p, i) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = ["←","↔","→"][i];
        b.title = p[0];
        b.setAttribute("aria-pressed", n.align === p[0] ? "true" : "false");
        b.addEventListener("click", function () { snap(); n.align = p[0]; render(); });
        seg.appendChild(b);
      });
      ar.appendChild(seg); g3.appendChild(ar);
      host.appendChild(g3);
    } else if (n.type !== "image") {
      var g4 = document.createElement("div"); g4.className = "grp";
      var add = document.createElement("button");
      add.type = "button"; add.className = "btn"; add.style.width = "100%";
      add.textContent = "+ Add text to this shape";
      add.addEventListener("click", function () {
        snap(); n.text = "Label"; editing = n.id; render();
      });
      g4.appendChild(add); host.appendChild(g4);
    }

    /* name */
    var g5 = document.createElement("div"); g5.className = "grp";
    var nr = document.createElement("div"); nr.className = "row";
    var nl = document.createElement("label"); nl.textContent = "layer name"; nl.htmlFor = "p_name";
    var ni = document.createElement("input"); ni.type = "text"; ni.id = "p_name"; ni.value = n.name;
    ni.addEventListener("input", function () { n.name = ni.value; renderLayers(); });
    nr.appendChild(nl); nr.appendChild(ni); g5.appendChild(nr);
    host.appendChild(g5);
  }

  function colorRow(lbl, val, set) {
    var r = document.createElement("div"); r.className = "row inline";
    var l = document.createElement("label"); l.textContent = lbl;
    var i = document.createElement("input"); i.type = "color";
    i.value = (val === "none" ? "#000000" : val);
    l.htmlFor = i.id = "p_" + lbl.replace(/\s/g, "");
    i.addEventListener("input", function () { set(i.value); render(); });
    r.appendChild(l); r.appendChild(i); return r;
  }

  function stepRow(lbl, val, lo, hi, set, step) {
    step = step || 1;
    var r = document.createElement("div"); r.className = "row inline";
    var l = document.createElement("label"); l.textContent = lbl;
    var s = document.createElement("div"); s.className = "stepper";
    var dec = document.createElement("button"); dec.type = "button"; dec.textContent = "−";
    dec.setAttribute("aria-label", "decrease " + lbl);
    var i = document.createElement("input"); i.type = "text"; i.value = val;
    l.htmlFor = i.id = "p_" + lbl.replace(/\s/g, "");
    var inc = document.createElement("button"); inc.type = "button"; inc.textContent = "+";
    inc.setAttribute("aria-label", "increase " + lbl);
    function apply(v) { snap(); set(Math.max(lo, Math.min(hi, v))); render(); }
    dec.addEventListener("click", function () { apply(Number(i.value) - step); });
    inc.addEventListener("click", function () { apply(Number(i.value) + step); });
    i.addEventListener("change", function () { apply(Number(i.value) || 0); });
    s.appendChild(dec); s.appendChild(i); s.appendChild(inc);
    r.appendChild(l); r.appendChild(s); return r;
  }

  /* ---------- pointer: draw / move / resize ---------- */

  var drag = null;

  $("frame").addEventListener("pointerdown", function (e) {
    if (editing) return;
    var rect = this.getBoundingClientRect();
    var px = (e.clientX - rect.left) / zoom;
    var py = (e.clientY - rect.top) / zoom;

    if (tool !== "move") {
      snap();
      var n = C.make(tool, Math.round(px), Math.round(py));
      nodes.push(n); sel = n.id;
      drag = { n: n, dir: "se", sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, ow: 1, oh: 1, creating: true };
      render();
      e.preventDefault();
      return;
    }

    var hd = e.target.closest(".hd");
    var el = e.target.closest(".n");
    if (!el) { sel = null; render(); return; }
    var node = C.byId(nodes, el.dataset.id);
    if (!node) return;
    if (sel !== node.id) { sel = node.id; render(); }
    snap();
    drag = { n: node, dir: hd ? hd.dataset.dir : null, sx: e.clientX, sy: e.clientY,
             ox: node.x, oy: node.y, ow: node.w, oh: node.h };
    e.preventDefault();
  });

  window.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = (e.clientX - drag.sx) / zoom, dy = (e.clientY - drag.sy) / zoom;
    C.transform(drag, dx, dy, W, H);
    render();
  });

  window.addEventListener("pointerup", function () {
    if (drag && drag.creating) {
      if (drag.n.w < 6 || drag.n.h < 6) { drag.n.w = Math.max(drag.n.w, 120); drag.n.h = Math.max(drag.n.h, 44); }
      setTool("move");
      render();
    }
    drag = null;
  });

  $("frame").addEventListener("dblclick", function (e) {
    var el = e.target.closest(".n");
    if (!el) return;
    var n = C.byId(nodes, el.dataset.id);
    if (!n || n.type === "image") return;
    if (n.text === null || n.text === undefined) n.text = "Label";
    sel = n.id; editing = n.id; render();
    var t = $("frame").querySelector('.n[data-id="' + n.id + '"] .tx');
    if (t) { t.focus(); document.getSelection().selectAllChildren(t); }
  });

  /* ---------- tools ---------- */

  var SHAPES = [
    { t: "rect",    n: "Rectangle", k: "R",
      g: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="14" height="10" rx="1.5"/></svg>' },
    { t: "ellipse", n: "Ellipse",   k: "O",
      g: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="10" cy="10" rx="7" ry="6"/></svg>' }
  ];
  var lastShape = "rect";

  function shapeDef(t) {
    for (var i = 0; i < SHAPES.length; i++) if (SHAPES[i].t === t) return SHAPES[i];
    return SHAPES[0];
  }

  function buildFlyout() {
    var f = $("shapeFly"); f.textContent = "";
    SHAPES.forEach(function (sh) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitemradio");
      b.setAttribute("aria-checked", lastShape === sh.t ? "true" : "false");
      b.innerHTML = sh.g + "<span>" + sh.n + "</span><kbd>" + sh.k + "</kbd>";
      b.addEventListener("click", function () { setTool(sh.t); closeFly(); });
      f.appendChild(b);
    });
  }

  function openFly() {
    buildFlyout();
    $("shapeFly").hidden = false;
    $("shapeBtn").setAttribute("aria-expanded", "true");
  }
  function closeFly() {
    $("shapeFly").hidden = true;
    $("shapeBtn").setAttribute("aria-expanded", "false");
  }

  function setTool(t) {
    tool = t;
    var isShape = (t === "rect" || t === "ellipse");
    if (isShape) lastShape = t;

    var all = $("tools").querySelectorAll(".tool[data-t]");
    for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", all[i].dataset.t === t ? "true" : "false");

    $("shapeBtn").setAttribute("aria-pressed", isShape ? "true" : "false");
    $("shapeIcon").innerHTML = shapeDef(lastShape).g;
    $("shapeBtn").title = shapeDef(lastShape).n + " (S)";
    $("frame").classList.toggle("draw", t !== "move");
  }

  $("tools").addEventListener("click", function (e) {
    var b = e.target.closest(".tool[data-t]");
    if (b) { closeFly(); setTool(b.dataset.t); return; }
    if (e.target.closest("#shapeBtn")) {
      if ($("shapeFly").hidden) { setTool(lastShape); openFly(); } else { closeFly(); }
    }
  });

  document.addEventListener("pointerdown", function (e) {
    if ($("shapeFly").hidden) return;
    if (e.target.closest("#shapeFly") || e.target.closest("#shapeBtn")) return;
    closeFly();
  });

  $("delBtn").addEventListener("click", function () {
    if (!sel) return; snap();
    nodes = nodes.filter(function (n) { return n.id !== sel; }); sel = null; render();
  });
  $("undoBtn").addEventListener("click", function () {
    if (!hist.length) return; nodes = JSON.parse(hist.pop()); sel = null; editing = null; render();
  });
  $("zoom").addEventListener("change", function (e) { zoom = Number(e.target.value); render(); });

  document.addEventListener("keydown", function (e) {
    if (!$("drawer").hidden) { if (e.key === "Escape") $("drawer").hidden = true; return; }
    var tag = (e.target.tagName || "").toLowerCase();
    if (editing || tag === "input" || tag === "select" || tag === "textarea") return;

    if (e.key === "Escape") { closeFly(); return; }
    if (e.key.toLowerCase() === "s") { setTool(lastShape); openFly(); return; }
    var map = { v: "move", r: "rect", o: "ellipse", t: "text", i: "image" };
    if (map[e.key.toLowerCase()]) { closeFly(); setTool(map[e.key.toLowerCase()]); return; }

    var n = cur(); if (!n) return;
    var s = e.shiftKey ? 10 : 1;
    if (e.key === "ArrowLeft")  { n.x -= s; e.preventDefault(); render(); }
    if (e.key === "ArrowRight") { n.x += s; e.preventDefault(); render(); }
    if (e.key === "ArrowUp")    { n.y -= s; e.preventDefault(); render(); }
    if (e.key === "ArrowDown")  { n.y += s; e.preventDefault(); render(); }
    if (e.key === "Enter")      { editing = n.id; if (n.text == null) n.text = "Label"; e.preventDefault(); render(); }
    if (e.key === "Delete" || e.key === "Backspace") {
      snap(); nodes = nodes.filter(function (x) { return x.id !== sel; }); sel = null; e.preventDefault(); render();
    }
  });

  /* ---------- generate ---------- */

  function paint() {
    var c = C.contract(nodes, cp);
    $("cpLabel").textContent = c.checkpoint;
    if (panel === "contract") $("out").textContent = JSON.stringify(c, null, 2);
    if (panel === "kt")       $("out").textContent = C.toKotlin(nodes, c);
    if (panel === "css")      $("out").textContent = C.toCss(nodes, c);
    if (panel === "html")     $("out").textContent = C.toHtml(nodes, c);
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-p]"); if (!b) return;
    panel = b.dataset.p;
    var all = this.querySelectorAll("button");
    for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-selected", all[i] === b ? "true" : "false");
    paint();
  });
  $("genBtn").addEventListener("click", function () { cp += 1; $("drawer").hidden = false; paint(); $("closeBtn").focus(); });
  $("closeBtn").addEventListener("click", function () { $("drawer").hidden = true; });
  $("drawer").addEventListener("click", function (e) { if (e.target === this) this.hidden = true; });

  $("themeBtn").addEventListener("click", function () {
    var root = document.documentElement, c = root.getAttribute("data-theme");
    var dark = c ? c === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  setTool("move");
  render();
})();
</script>
