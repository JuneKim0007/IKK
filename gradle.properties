# The JDK is NOT pinned here. Each module declares jvmToolchain(17) and the
# foojay resolver in settings.gradle.kts fetches a matching JDK if the machine
# has none. That keeps the build reproducible on a fresh clone.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
