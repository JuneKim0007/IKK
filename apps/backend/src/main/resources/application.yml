server:
  address: ${IKK_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8000}
  shutdown: graceful

spring:
  application:
    name: ikk-backend
  datasource:
    url: ${IKK_DATABASE_URL:jdbc:h2:file:./data/ikk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${IKK_DATABASE_USER:sa}
    password: ${IKK_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

ikk:
  api-token: ${IKK_API_TOKEN:}
  allowed-origins: ${IKK_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  asset-max-bytes: ${IKK_ASSET_MAX_BYTES:10485760}
  codegen-script: ${IKK_CODEGEN_SCRIPT:packages/codegen/generate.mjs}
  node-executable: ${IKK_NODE_EXECUTABLE:node}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
