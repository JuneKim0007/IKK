<title>Deck Composer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #E6E9E9;
    --surface: #FFFFFF;
    --surface-2: #F1F3F3;
    --ink: #16191B;
    --muted: #5C696E;
    --line: #D0D5D6;
    --line-soft: #E2E6E6;
    --accent: #0F6157;
    --accent-ink: #FFFFFF;
    --accent-soft: #DAEAE7;
    --danger: #A8441A;
    --slide-bg: #FFFFFF;
    --slide-ink: #16191B;
    --slide-muted: #5C696E;
    --shadow-sm: 0 1px 2px rgba(16, 25, 28, .10);
    --shadow-md: 0 2px 4px rgba(16, 25, 28, .08), 0 10px 28px rgba(16, 25, 28, .08);
    --rail: 228px;
    --inspector: 288px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101213;
      --surface: #1A1D1F;
      --surface-2: #222628;
      --ink: #E5E9EA;
      --muted: #8FA0A5;
      --line: #2F3538;
      --line-soft: #262B2D;
      --accent: #45B4A3;
      --accent-ink: #062320;
      --accent-soft: #14332F;
      --danger: #DD8258;
      --slide-bg: #F5F5F4;
      --slide-ink: #16191B;
      --slide-muted: #5C696E;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .40);
      --shadow-md: 0 2px 4px rgba(0, 0, 0, .34), 0 10px 28px rgba(0, 0, 0, .34);
    }
  }

  :root[data-theme="dark"] {
    --ground: #101213;
    --surface: #1A1D1F;
    --surface-2: #222628;
    --ink: #E5E9EA;
    --muted: #8FA0A5;
    --line: #2F3538;
    --line-soft: #262B2D;
    --accent: #45B4A3;
    --accent-ink: #062320;
    --accent-soft: #14332F;
    --danger: #DD8258;
    --slide-bg: #F5F5F4;
    --slide-ink: #16191B;
    --slide-muted: #5C696E;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .40);
    --shadow-md: 0 2px 4px rgba(0, 0, 0, .34), 0 10px 28px rgba(0, 0, 0, .34);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- shell ---------- */

  .app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100%;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .brand-mark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .brand-tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .deck-title {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 5px 8px;
    min-width: 0;
    flex: 1 1 180px;
  }
  .deck-title:hover { border-color: var(--line); }
  .deck-title:focus { border-color: var(--accent); outline: none; background: var(--surface-2); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 7px 12px;
    border-radius: 6px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }

  .btn-icon {
    border: 1px solid var(--line);
    background: var(--surface);
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    padding: 0;
    line-height: 1;
  }
  .btn-icon:hover { background: var(--surface-2); }
  .btn-icon[disabled] { opacity: .38; cursor: not-allowed; }

  /* ---------- workspace ---------- */

  .workspace {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--inspector);
    min-height: 0;
  }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    min-height: 0;
  }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line-soft);
  }

  .pane-title {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .slide-list {
    list-style: none;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    min-height: 0;
  }

  .slide-item {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 9px;
    align-items: start;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    width: 100%;
  }

  .slide-num {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 12px;
    font-variant-numeric: tabular-nums;
  }

  .thumb {
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--slide-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .slide-item[aria-current="true"] .thumb {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .slide-item[aria-current="true"] .slide-num { color: var(--accent); font-weight: 600; }

  .thumb-title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 8px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--slide-ink);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .thumb-line {
    height: 2px;
    border-radius: 1px;
    background: var(--slide-muted);
    opacity: .34;
  }
  .thumb.is-section { justify-content: center; align-items: flex-start; }
  .thumb.is-section .thumb-title { font-size: 10px; }

  .rail-foot { padding: 10px; border-top: 1px solid var(--line-soft); }
  .rail-foot .btn { width: 100%; justify-content: center; }

  /* ---------- canvas ---------- */

  .stage {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 26px 20px 30px;
  }

  .slide {
    width: 100%;
    max-width: 780px;
    aspect-ratio: 16 / 9;
    background: var(--slide-bg);
    color: var(--slide-ink);
    border-radius: 6px;
    box-shadow: var(--shadow-md);
    padding: 7% 8%;
    display: flex;
    flex-direction: column;
    gap: 3.5%;
    overflow: hidden;
  }

  .slide.is-section { justify-content: center; }
  .slide.is-section .slide-heading { font-size: clamp(26px, 5.4vw, 46px); }
  .slide.is-section .slide-rule {
    width: 54px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  .slide-heading {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(20px, 3.6vw, 33px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.015em;
    text-wrap: balance;
    margin: 0;
    outline: none;
  }

  .slide-body {
    font-size: clamp(12px, 1.7vw, 16px);
    line-height: 1.6;
    color: var(--slide-muted);
    white-space: pre-wrap;
    outline: none;
    min-height: 1.6em;
    overflow: auto;
    flex: 1 1 auto;
  }
  .slide.two-col .slide-body { columns: 2; column-gap: 8%; }

  [contenteditable]:focus { box-shadow: 0 0 0 2px var(--accent); border-radius: 3px; }
  [contenteditable]:empty::before {
    content: attr(data-placeholder);
    color: var(--slide-muted);
    opacity: .5;
  }

  .stage-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- inspector ---------- */

  .inspector {
    background: var(--surface);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    min-height: 0;
  }

  .field { padding: 14px; border-bottom: 1px solid var(--line-soft); }

  .field-label {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 9px;
  }

  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

  .layout-opt {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 5px;
    padding: 8px 7px;
    display: grid;
    gap: 6px;
    justify-items: start;
    font-size: 11px;
    color: var(--muted);
  }
  .layout-opt:hover { background: var(--surface-2); }
  .layout-opt[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .layout-glyph { display: grid; gap: 2px; width: 100%; }
  .layout-glyph i { display: block; height: 2px; background: currentColor; opacity: .5; border-radius: 1px; }
  .layout-glyph i.head { height: 4px; opacity: .85; width: 60%; }
  .layout-glyph.cols { grid-template-columns: 1fr 1fr; grid-auto-rows: 2px; }
  .layout-glyph.cols i.head { grid-column: 1 / -1; }

  .notes {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 8px 9px;
  }
  .notes:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 12px;
  }
  .stat-row dt { color: var(--muted); }
  .stat-row dd { margin: 0; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .danger {
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
  }
  .danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }

  /* ---------- generate dialog ---------- */

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 13, .52);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 40;
  }

  .sheet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    width: min(430px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 18px;
  }

  .sheet h2 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .sheet-note {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 15px;
    padding-left: 9px;
    border-left: 2px solid var(--accent);
  }

  .sheet label {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .sheet input[type="text"], .sheet select, .sheet textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 8px 9px;
    margin-bottom: 13px;
  }
  .sheet textarea { min-height: 62px; resize: vertical; }
  .sheet input:focus, .sheet select:focus, .sheet textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- present ---------- */

  .present {
    position: fixed;
    inset: 0;
    background: #0B0D0E;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    z-index: 50;
    padding: 20px;
  }
  .present-stage { display: grid; place-items: center; min-height: 0; }
  .present .slide { max-width: min(1000px, 100%); max-height: 100%; box-shadow: none; }
  .present-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #C9D2D4;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    padding-top: 14px;
    font-variant-numeric: tabular-nums;
  }
  .present-bar .btn { background: #1C2022; border-color: #32393B; color: #E3E9EA; }
  .present-bar .btn:hover { background: #262B2D; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- narrow ---------- */

  @media (max-width: 900px) {
    .workspace {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      overflow-y: auto;
    }
    .rail, .inspector { border: none; border-bottom: 1px solid var(--line); }
    .rail { grid-template-rows: auto auto auto; }
    .slide-list {
      flex-direction: row;
      overflow-x: auto;
      padding: 10px 16px;
    }
    .slide-item { grid-template-columns: minmax(0, 1fr); width: 128px; flex: 0 0 auto; }
    .slide-num { padding-top: 0; padding-bottom: 3px; }
    .stage { padding: 18px 16px 24px; }
    .rail-foot { padding: 10px 16px; }
    .field { padding: 14px 16px; }
    .topbar { padding-left: 16px; padding-right: 16px; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Deck Composer</span>
      <span class="brand-tag">Prototype</span>
    </div>

    <input id="deckTitle" class="deck-title" aria-label="Deck title" value="IKK — Build Notes">

    <div class="topbar-actions">
      <button id="themeBtn" class="btn" type="button" aria-label="Toggle colour theme">Theme</button>
      <button id="presentBtn" class="btn" type="button">Present</button>
      <button id="generateBtn" class="btn btn-primary" type="button">Generate</button>
    </div>
  </header>

  <div class="workspace">
    <nav class="rail" aria-label="Slides">
      <div class="pane-head">
        <span class="pane-title">Slides</span>
        <span class="pane-title" id="slideCount">0</span>
      </div>
      <ul class="slide-list" id="slideList"></ul>
      <div class="rail-foot">
        <button id="addBtn" class="btn" type="button">+ Add slide</button>
      </div>
    </nav>

    <main class="stage">
      <article class="slide" id="canvas">
        <h1 class="slide-heading" id="canvasTitle" contenteditable="plaintext-only"
            data-placeholder="Slide title"></h1>
        <div class="slide-rule" id="canvasRule" hidden></div>
        <div class="slide-body" id="canvasBody" contenteditable="plaintext-only"
             data-placeholder="One point per line"></div>
      </article>
      <div class="stage-meta">
        <span id="positionLabel">Slide 1 of 1</span>
        <button id="prevBtn" class="btn-icon" type="button" aria-label="Previous slide">&#8593;</button>
        <button id="nextBtn" class="btn-icon" type="button" aria-label="Next slide">&#8595;</button>
      </div>
    </main>

    <aside class="inspector" aria-label="Slide settings">
      <div class="field">
        <span class="field-label">Layout</span>
        <div class="layout-grid" id="layoutGrid">
          <button class="layout-opt" type="button" data-layout="titleBody" aria-pressed="false">
            <span class="layout-glyph"><i class="head"></i><i></i><i></i><i></i></span>
            Title &amp; body
          </button>
          <button class="layout-opt" type="button" data-layout="section" aria-pressed="false">
            <span class="layout-glyph"><i class="head"></i></span>
            Section
          </button>
          <button class="layout-opt" type="button" data-layout="twoCol" aria-pressed="false">
            <span class="layout-glyph cols"><i class="head"></i><i></i><i></i><i></i><i></i></span>
            Two columns
          </button>
          <button class="layout-opt" type="button" data-layout="titleOnly" aria-pressed="false">
            <span class="layout-glyph"><i class="head"></i><i></i></span>
            Title only
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="notesInput">Speaker notes</label>
        <textarea id="notesInput" class="notes" placeholder="Not shown on the slide."></textarea>
      </div>

      <div class="field">
        <span class="field-label">This slide</span>
        <dl style="margin:0">
          <div class="stat-row"><dt>Words</dt><dd id="statWords">0</dd></div>
          <div class="stat-row"><dt>Lines</dt><dd id="statLines">0</dd></div>
          <div class="stat-row"><dt>Est. time</dt><dd id="statTime">0:00</dd></div>
        </dl>
      </div>

      <div class="field" style="display:grid; gap:7px">
        <button id="dupBtn" class="btn" type="button">Duplicate slide</button>
        <button id="upBtn" class="btn" type="button">Move up</button>
        <button id="downBtn" class="btn" type="button">Move down</button>
        <button id="delBtn" class="btn danger" type="button">Delete slide</button>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="genScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="genHeading">
    <h2 id="genHeading">Generate an outline</h2>
    <p class="sheet-note">
      Prototype behaviour: this builds a placeholder outline locally from a
      fixed template. No model is called.
    </p>

    <label for="genTopic">Topic</label>
    <input type="text" id="genTopic" value="Shipping IKK in one term">

    <label for="genAudience">Audience</label>
    <input type="text" id="genAudience" value="Capstone review panel">

    <label for="genCount">Slides</label>
    <select id="genCount">
      <option>4</option>
      <option selected>6</option>
      <option>8</option>
      <option>10</option>
    </select>

    <div class="sheet-actions">
      <button id="genCancel" class="btn" type="button">Cancel</button>
      <button id="genRun" class="btn btn-primary" type="button">Generate deck</button>
    </div>
  </div>
</div>

<div class="present" id="present" hidden>
  <div class="present-stage">
    <article class="slide" id="presentSlide">
      <h1 class="slide-heading" id="presentTitle"></h1>
      <div class="slide-rule" id="presentRule" hidden></div>
      <div class="slide-body" id="presentBody"></div>
    </article>
  </div>
  <div class="present-bar">
    <button id="presentPrev" class="btn" type="button">&#8592; Prev</button>
    <span id="presentPos">1 / 1</span>
    <button id="presentNext" class="btn" type="button">Next &#8594;</button>
    <button id="presentExit" class="btn" type="button">Exit (Esc)</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "deck-composer/v1";
  var WORDS_PER_MIN = 130;

  var SAMPLE = {
    title: "IKK — Build Notes",
    slides: [
      {
        layout: "section",
        title: "IKK",
        body: "An Android app, built in public over one term.",
        notes: "Open cold. Say what it is in one sentence before any architecture."
      },
      {
        layout: "titleBody",
        title: "Where the code lives",
        body: "app — Activity, Compose UI, wiring\ndata — repositories, the data seam\ncore — pure Kotlin, zero Android imports\nDependencies point downward only",
        notes: "The point of core is that android.* is not on its classpath. A layering mistake fails the build."
      },
      {
        layout: "twoCol",
        title: "What the split buys",
        body: "core tests run on the desktop JVM\nNo emulator, no Robolectric\nUnder a second, every run\n\nLayering is compiler-enforced\nNot a review comment\nNot a naming convention",
        notes: "Contrast with package-only structure, where nothing stops a bad import."
      },
      {
        layout: "titleBody",
        title: "Toolchain, and what bit us",
        body: "AGP 9 rejects the Kotlin Android plugin outright\nJDK 21 pinned per project — 25 and 26 are unsupported\ncompileSdk follows dependencies, not target devices\nconnectedAndroidTest uninstalls the app when it finishes",
        notes: "Each of these cost real time. Worth naming so the panel knows they were hit, not avoided."
      },
      {
        layout: "titleOnly",
        title: "Demo",
        body: "",
        notes: "Switch to the emulator here. Launch cold so the first frame is honest."
      }
    ]
  };

  var OUTLINE = [
    { t: "The problem", b: "Who runs into this today\nWhat it costs them per week\nWhy the existing options fall short" },
    { t: "Approach", b: "The core idea, in one sentence\nWhat gets built first\nWhat is deliberately out of scope" },
    { t: "Architecture", b: "The modules and their boundaries\nWhere state lives\nThe failure modes designed for" },
    { t: "Demo", b: "The happy path\nOne edge case worth showing\nWhat to watch for while it runs" },
    { t: "What we measured", b: "The numbers that moved\nWhat was surprising\nWhat would be done differently" },
    { t: "Roadmap", b: "The next two weeks\nOpen questions\nWhat we need from this room" },
    { t: "Risks", b: "What could still go wrong\nHow it would be detected\nThe fallback plan" },
    { t: "Prior work", b: "What already exists\nWhere it stops short\nThe gap this fills" }
  ];

  var deck = load() || clone(SAMPLE);
  var current = 0;
  var presentIndex = 0;

  var $ = function (id) { return document.getElementById(id); };

  var els = {
    deckTitle: $("deckTitle"),
    list: $("slideList"),
    count: $("slideCount"),
    canvas: $("canvas"),
    title: $("canvasTitle"),
    rule: $("canvasRule"),
    body: $("canvasBody"),
    position: $("positionLabel"),
    notes: $("notesInput"),
    layoutGrid: $("layoutGrid"),
    statWords: $("statWords"),
    statLines: $("statLines"),
    statTime: $("statTime"),
    genScrim: $("genScrim"),
    present: $("present"),
    presentSlide: $("presentSlide"),
    presentTitle: $("presentTitle"),
    presentRule: $("presentRule"),
    presentBody: $("presentBody"),
    presentPos: $("presentPos")
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.slides) && parsed.slides.length) return parsed;
      return null;
    } catch (e) { return null; }
  }

  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(deck)); } catch (e) { /* ignore */ }
  }

  function slide() { return deck.slides[current]; }

  function layoutClass(layout) {
    if (layout === "section") return "slide is-section";
    if (layout === "twoCol") return "slide two-col";
    return "slide";
  }

  /* ---------- rendering ---------- */

  function renderRail() {
    els.list.textContent = "";
    els.count.textContent = String(deck.slides.length);

    deck.slides.forEach(function (s, i) {
      var li = document.createElement("li");

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "slide-item";
      btn.setAttribute("aria-current", i === current ? "true" : "false");
      btn.addEventListener("click", function () { select(i); });

      var num = document.createElement("span");
      num.className = "slide-num";
      num.textContent = String(i + 1).padStart(2, "0");

      var thumb = document.createElement("span");
      thumb.className = "thumb" + (s.layout === "section" ? " is-section" : "");

      var t = document.createElement("span");
      t.className = "thumb-title";
      t.textContent = s.title || "Untitled";
      thumb.appendChild(t);

      if (s.layout !== "section" && s.layout !== "titleOnly") {
        var lines = String(s.body || "").split("\n").filter(function (l) { return l.trim(); });
        lines.slice(0, 3).forEach(function (l) {
          var bar = document.createElement("span");
          bar.className = "thumb-line";
          bar.style.width = Math.max(28, Math.min(100, l.length * 3.4)) + "%";
          thumb.appendChild(bar);
        });
      }

      btn.appendChild(num);
      btn.appendChild(thumb);
      li.appendChild(btn);
      els.list.appendChild(li);
    });
  }

  function renderCanvas() {
    var s = slide();
    els.canvas.className = layoutClass(s.layout);
    els.title.textContent = s.title || "";
    els.body.textContent = s.body || "";
    els.rule.hidden = s.layout !== "section";
    els.notes.value = s.notes || "";
    els.position.textContent = "Slide " + (current + 1) + " of " + deck.slides.length;

    var opts = els.layoutGrid.querySelectorAll(".layout-opt");
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute("aria-pressed", opts[i].dataset.layout === s.layout ? "true" : "false");
    }

    renderStats(s);
  }

  function renderStats(s) {
    var text = (s.title || "") + " " + (s.body || "");
    var words = text.split(/\s+/).filter(Boolean).length;
    var lines = String(s.body || "").split("\n").filter(function (l) { return l.trim(); }).length;
    var secs = Math.round((words / WORDS_PER_MIN) * 60);

    els.statWords.textContent = String(words);
    els.statLines.textContent = String(lines);
    els.statTime.textContent = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
  }

  function render() {
    renderRail();
    renderCanvas();
    save();
  }

  function select(i) {
    current = Math.max(0, Math.min(i, deck.slides.length - 1));
    render();
  }

  /* ---------- editing ---------- */

  els.title.addEventListener("input", function () {
    slide().title = els.title.textContent.trim();
    renderRail();
    renderStats(slide());
    save();
  });

  els.body.addEventListener("input", function () {
    slide().body = els.body.textContent;
    renderRail();
    renderStats(slide());
    save();
  });

  els.notes.addEventListener("input", function () {
    slide().notes = els.notes.value;
    save();
  });

  els.deckTitle.addEventListener("input", function () {
    deck.title = els.deckTitle.value;
    save();
  });

  els.layoutGrid.addEventListener("click", function (e) {
    var opt = e.target.closest(".layout-opt");
    if (!opt) return;
    slide().layout = opt.dataset.layout;
    render();
  });

  /* ---------- slide operations ---------- */

  $("addBtn").addEventListener("click", function () {
    deck.slides.splice(current + 1, 0, {
      layout: "titleBody", title: "", body: "", notes: ""
    });
    select(current + 1);
    els.title.focus();
  });

  $("dupBtn").addEventListener("click", function () {
    deck.slides.splice(current + 1, 0, clone(slide()));
    select(current + 1);
  });

  $("delBtn").addEventListener("click", function () {
    if (deck.slides.length === 1) {
      deck.slides[0] = { layout: "titleBody", title: "", body: "", notes: "" };
      select(0);
      return;
    }
    deck.slides.splice(current, 1);
    select(Math.min(current, deck.slides.length - 1));
  });

  function move(delta) {
    var to = current + delta;
    if (to < 0 || to >= deck.slides.length) return;
    var s = deck.slides.splice(current, 1)[0];
    deck.slides.splice(to, 0, s);
    select(to);
  }

  $("upBtn").addEventListener("click", function () { move(-1); });
  $("downBtn").addEventListener("click", function () { move(1); });
  $("prevBtn").addEventListener("click", function () { select(current - 1); });
  $("nextBtn").addEventListener("click", function () { select(current + 1); });

  /* ---------- generate ---------- */

  function openGen() {
    els.genScrim.hidden = false;
    $("genTopic").focus();
    $("genTopic").select();
  }

  function closeGen() { els.genScrim.hidden = true; }

  $("generateBtn").addEventListener("click", openGen);
  $("genCancel").addEventListener("click", closeGen);

  els.genScrim.addEventListener("click", function (e) {
    if (e.target === els.genScrim) closeGen();
  });

  $("genRun").addEventListener("click", function () {
    var topic = $("genTopic").value.trim() || "Untitled deck";
    var audience = $("genAudience").value.trim();
    var n = parseInt($("genCount").value, 10);

    var slides = [{
      layout: "section",
      title: topic,
      body: audience ? "Prepared for " + audience : "",
      notes: "Placeholder outline. Replace every line before this is shown to anyone."
    }];

    for (var i = 0; i < n - 1; i++) {
      var tpl = OUTLINE[i % OUTLINE.length];
      slides.push({
        layout: i % 3 === 2 ? "twoCol" : "titleBody",
        title: tpl.t,
        body: tpl.b,
        notes: "TODO: replace with the real content for “" + tpl.t + "”."
      });
    }

    deck.title = topic;
    deck.slides = slides;
    els.deckTitle.value = topic;
    closeGen();
    select(0);
  });

  /* ---------- present ---------- */

  function paintPresent() {
    var s = deck.slides[presentIndex];
    els.presentSlide.className = layoutClass(s.layout);
    els.presentTitle.textContent = s.title || "";
    els.presentBody.textContent = s.layout === "titleOnly" ? "" : (s.body || "");
    els.presentRule.hidden = s.layout !== "section";
    els.presentPos.textContent = (presentIndex + 1) + " / " + deck.slides.length;
  }

  function openPresent() {
    presentIndex = current;
    els.present.hidden = false;
    paintPresent();
    $("presentNext").focus();
  }

  function closePresent() {
    els.present.hidden = true;
    select(presentIndex);
  }

  function step(delta) {
    presentIndex = Math.max(0, Math.min(presentIndex + delta, deck.slides.length - 1));
    paintPresent();
  }

  $("presentBtn").addEventListener("click", openPresent);
  $("presentExit").addEventListener("click", closePresent);
  $("presentPrev").addEventListener("click", function () { step(-1); });
  $("presentNext").addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if (!els.present.hidden) {
      if (e.key === "Escape") { closePresent(); }
      else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      return;
    }
    if (!els.genScrim.hidden && e.key === "Escape") { closeGen(); }
  });

  /* ---------- theme ---------- */

  $("themeBtn").addEventListener("click", function () {
    var root = document.documentElement;
    var explicit = root.getAttribute("data-theme");
    var dark = explicit
      ? explicit === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ---------- boot ---------- */

  els.deckTitle.value = deck.title || "Untitled deck";
  render();
})();
</script>
