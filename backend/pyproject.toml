[project]
name = "ikk-backend"
version = "0.1.0"
description = "Contract sync and code generation for IKK"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "httpx>=0.28", "ruff>=0.13", "mypy>=1.18"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
