name: backend

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v6

      - name: Backend and contract tests
        run: >-
          ./gradlew
          :packages:design-contract:test
          :apps:backend:test
          :apps:backend:bootJar

      - name: Codegen tests
        run: npm test --prefix packages/codegen
