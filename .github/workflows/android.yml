name: android

on:
  push:
  pull_request:

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build declares jvmToolchain(17) and resolves it via the foojay
      # plugin, but providing a 17 here saves the download on every run.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug
        run: ./gradlew assembleDebug
